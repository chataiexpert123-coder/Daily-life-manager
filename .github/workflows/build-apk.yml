name: Build My Daily Life Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted
          rsync -a extracted/ ./
          cp patches/src/services/sheetsSync.ts src/services/sheetsSync.ts
          cp patches/src/components/Settings/GoogleSheetsSettings.tsx src/components/Settings/GoogleSheetsSettings.tsx
          cp patches/src/index.css src/index.css
          cp patches/capacitor.config.ts capacitor.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Daily-Life-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
